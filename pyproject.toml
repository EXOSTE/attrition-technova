[project]
name = "attrition-technova"
version = "0.1.0"
description = "Analyse des causes d'attrition chez TechNova Partners : exploration, classification et interprétation SHAP"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "nbconvert>=7.17.2",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
